<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar dados do projeto</title>
<link rel="icon" type="image/png" href="assets/v8p.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="client-edit-page">
  <div class="brand-row">
    <img src="assets/v8p.png" alt="Logo">
    <strong id="client-project-name">Carregando...</strong>
  </div>

  <div id="client-content"></div>
</div>

<script src="js/api.js"></script>
<script>
const FIELD_LABELS = {
  "tracking.pixel": "Meta Pixel (ID)",
  "tracking.tag": "Google Tag / GTM (ID)",
  "tracking.analytics": "Google Analytics (ID)",
  "contact.whatsapp": "WhatsApp",
  "contact.email": "E-mail",
  "contact.phone": "Telefone",
  "social.facebook": "Facebook",
  "social.instagram": "Instagram",
  "social.tiktok": "TikTok",
  "social.youtube": "YouTube",
  "social.linkedin": "LinkedIn",
  "formspree": "Formspree (endpoint)",
};

function getByPath(obj, path) {
  return path.split(".").reduce((o, k) => (o ? o[k] : undefined), obj);
}
function setByPath(obj, path, value) {
  const keys = path.split(".");
  let cur = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    if (typeof cur[keys[i]] !== "object" || cur[keys[i]] === null) cur[keys[i]] = {};
    cur = cur[keys[i]];
  }
  cur[keys[keys.length - 1]] = value;
}
function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fieldId(path) { return "f-" + path.replace(/\./g, "-"); }

const token = new URLSearchParams(window.location.search).get("token");
const content = document.getElementById("content") || document.getElementById("client-content");

async function init() {
  if (!token) {
    content.innerHTML = `<div class="card"><strong>Link inválido.</strong><p style="color:var(--text-muted);margin-top:6px">Faltou o token de acesso na URL. Peça um novo link.</p></div>`;
    return;
  }

  const res = await API.getPublic(`/api/client/${token}`);
  if (res.error) {
    content.innerHTML = `<div class="card"><strong>Não foi possível abrir este link.</strong><p style="color:var(--text-muted);margin-top:6px">${escapeHtml(res.message || "O link pode ter sido revogado ou expirado. Peça um novo link a quem administra o site.")}</p></div>`;
    return;
  }

  document.getElementById("client-project-name").textContent = res.projectName;

  const fieldsHtml = res.fields.map((path) => `
    <div class="field">
      <label>${FIELD_LABELS[path] || path}</label>
      <input id="${fieldId(path)}" value="${escapeHtml(getByPath(res.data, path) || "")}">
    </div>
  `).join("");

  content.innerHTML = `
    <div class="card">
      ${fieldsHtml}
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="save()">Salvar alterações</button>
      <div id="save-msg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
  `;

  window._clientFields = res.fields;
}

async function save() {
  const body = {};
  for (const path of window._clientFields) {
    setByPath(body, path, document.getElementById(fieldId(path)).value.trim());
  }

  const msg = document.getElementById("save-msg");
  msg.textContent = "Salvando...";
  msg.style.color = "var(--text-muted)";

  const res = await API.putPublic(`/api/client/${token}`, body);
  if (res.error) {
    msg.textContent = res.message || "Erro ao salvar.";
    msg.style.color = "var(--danger)";
    return;
  }
  msg.textContent = "Alterações salvas com sucesso.";
  msg.style.color = "var(--success)";
}

document.documentElement.setAttribute("data-theme", "dark");
init();
</script>
</body>
</html>
