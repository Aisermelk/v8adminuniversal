<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — V8 ADMIN</title>
<link rel="icon" type="image/png" href="assets/v8p.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><img src="assets/v8p.png" alt="V8 ADMIN"></div>
    <h1>V8 ADMIN</h1>
    <p class="sub">Entre com suas credenciais de administrador</p>

    <div class="auth-error hidden" id="auth-error"></div>

    <form id="login-form" onsubmit="handleLoginSubmit(event)">
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="login-submit" style="width:100%;justify-content:center;margin-top:6px">Entrar</button>
    </form>
  </div>
</div>

<script>
  // aplica tema salvo antes de renderizar, evita flash
  document.documentElement.setAttribute("data-theme", localStorage.getItem("v8_theme") || "dark");
  if (Boolean(localStorage.getItem("v8_admin_token")) && Number(localStorage.getItem("v8_admin_token_expires") || 0) > Date.now()) {
    window.location.href = "index.html";
  }
</script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
