<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V8 ADMIN — Universal</title>
<link rel="icon" type="image/png" href="assets/v8p.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="assets/v8p.png" alt="Logo">
      <span>V8 ADMIN</span>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-section="dashboard"><span class="dot"></span> Dashboard</button>
      <button class="nav-item" data-section="clients"><span class="dot"></span> Clientes</button>
      <button class="nav-item" data-section="projects"><span class="dot"></span> Projetos</button>
    </nav>

    <div class="sidebar-footer">
      <div class="checkbox-row" style="padding:6px 8px">
        <label style="margin:0;font-weight:400;color:var(--text-muted);font-size:12.5px;display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="theme-toggle" style="width:auto"> Tema claro
        </label>
      </div>
      <button class="btn btn-ghost btn-sm" id="logout-btn" style="width:100%;justify-content:center">Sair</button>
    </div>
  </aside>

  <main class="main">

    <section class="section" data-section="dashboard">
      <div class="page-header">
        <div><h1>Dashboard</h1><p>Visão geral de todos os seus projetos</p></div>
      </div>
      <div class="stat-grid" id="dashboard-stats"></div>
      <div class="section-title">Leads recentes</div>
      <div class="table-wrap" id="dashboard-recent-leads"></div>
    </section>

    <section class="section hidden" data-section="clients">
      <div class="page-header">
        <div><h1>Clientes</h1><p>Pessoas ou empresas para quem você presta serviço</p></div>
        <button class="btn btn-primary" onclick="openClientModal()">+ Novo cliente</button>
      </div>
      <div class="table-wrap" id="clients-table-wrap"></div>
    </section>

    <section class="section hidden" data-section="projects">
      <div class="page-header">
        <div><h1>Projetos</h1><p>Sites gerenciados por este painel — rastreamento, contato, redes e acesso do cliente</p></div>
        <button class="btn btn-primary" onclick="openProjectModal()">+ Novo projeto</button>
      </div>
      <div class="table-wrap" id="projects-table-wrap"></div>
    </section>

  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
